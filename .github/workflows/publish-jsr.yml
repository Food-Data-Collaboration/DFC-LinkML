name: Publish TypeScript Connector (jsr)
on:
  push:
    tags:
      - '@siol-data/linkml-connector@*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # jsr exchanges this OIDC token for publish rights
      contents: read
    defaults:
      run:
        working-directory: typescript-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx jsr publish --dry-run --allow-dirty
      - run: npx jsr publish
      # Nudge packagist too. Its GitHub webhook fires on every push, but a tag
      # push can race it, and the webhook alone is a single point of failure
      # for the PHP package. Harmless when the hook already did the work.
      #
      # Per packagist's documented contract the credentials go in the query
      # string, not as basic auth. The token is a secret so Actions masks it
      # in logs.
      #
      # Deliberately not fatal: the jsr publish above is the primary action,
      # and a packagist credential problem must not fail it. A failure here
      # logs a warning and the weekly crawl still catches up.
      - name: Notify packagist
        if: success()
        continue-on-error: true
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::warning::packagist credentials not set; relying on the GitHub webhook."
            exit 0
          fi
          code=$(curl --silent --output /tmp/pk.out --write-out '%{http_code}' \
            -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -H 'content-type: application/json' \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}" || true)
          case "$code" in
            2*) echo "packagist notified (HTTP $code)" ;;
            *)  echo "::warning::packagist update returned HTTP $code: $(head -c 200 /tmp/pk.out)"
                echo "::warning::the jsr publish above succeeded; packagist will retry on its next crawl."
                ;;
          esac
