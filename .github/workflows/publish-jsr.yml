name: Publish TypeScript Connector (jsr)
on:
  push:
    tags:
      - '@siol-data/linkml-connector@*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # jsr exchanges this OIDC token for publish rights
      contents: read
    defaults:
      run:
        working-directory: typescript-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx jsr publish --dry-run --allow-dirty
      - run: npx jsr publish
