name: Publish Ruby gem

# Publishes dfc-linkml-connector to rubygems.org on a `v*` tag.
#
# RubyGems is the one registry here that is not derived from the tag alone: it
# needs a credentialed `gem push`, so unlike packagist (which reads the git tag
# via webhook) this job has to run. It therefore cannot be folded into the
# jsr publish path, which fires on the scoped `@siol-data/linkml-connector@*`
# tag -- a different tag from the `v*` one this listens to.
#
# Unlike packagist's notify step, a failure here is fatal by design. A tag that
# exists but was never pushed is a released-looking version with no artifact,
# and gem versions are immutable, so the number is spent. Failing loudly is the
# only way to notice.
on:
  push:
    tags:
      - 'v*'
  # The recovery path for a failed tag publish. There is deliberately no input
  # for supplying a prebuilt gem: workflow_dispatch cannot receive an uploaded
  # file, so an input promising to accept one would be a dead control.
  workflow_dispatch:

# Least privilege for the token exchange itself; id-token: write is declared on
# the job that needs it, not here.

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    # Set per job rather than workflow-wide: id-token: write is what lets the
    # runner prove its identity to rubygems.org in exchange for a push token, so
    # it should be granted only to the job that publishes, not to anything else
    # in this file. RubyGems' docs recommend job level over workflow level for
    # exactly this reason.
    permissions:
      contents: read
      id-token: write

    # The gemspec is at ruby-gem/dfc-linkml-connector.gemspec, not the repo
    # root. Every step below operates on the gem, so the directory is set once
    # here rather than repeated per step -- and because `gem build` fails with a
    # "couldn't find a gemspec" error rather than anything subtler, getting this
    # wrong is a loud failure, not a wrong artifact.
    defaults:
      run:
        working-directory: ruby-gem

    steps:
      # The release tag has to be resolved before the tree can be checked out,
      # but resolving needs the repository's refs -- so this first checkout
      # exists purely to fetch them. Without it `git tag --list` runs against an
      # empty workspace and finds nothing.
      #
      # fetch-depth 0 is required for that tag list: the default shallow checkout
      # fetches no tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cwd is the workspace root, not the job default: ruby-gem/ does not exist
      # until a tree is checked out, so the default cannot apply to this step.
      # Tag resolution is a git-level concern and belongs at the root regardless.
      - name: Resolve the release tag
        id: release
        working-directory: ${{ github.workspace }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
              if [ -z "$tag" ]; then
                echo "::error::no v* tag found; nothing to publish."
                exit 1
              fi
              echo "dispatched from ${GITHUB_REF#refs/}; recovering the newest release tag ${tag}"
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Re-checkout at the resolved tag. This is what makes workflow_dispatch
      # safe: the ref a dispatch arrives on is a branch, and publishing from it
      # would ship whatever the branch holds rather than what the tag says.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          # rubygems is the point of this job, so it is pinned rather than
          # inherited: an unpinned major could change push semantics under us.
          rubygems: 'latest'

      # The gem is built from the tagged tree. Regenerating it here would publish
      # whatever the generator produces today rather than what the tag says, so
      # the committed .gemspec is used verbatim.
      #
      # GEM_VERSION is read out of the built archive here, once, and exported for
      # every later step. Two earlier versions of this file re-derived it three
      # times via `gem spec <file> version | head -1` -- which is a trap, because
      # that command prints YAML and head -1 yields the document marker
      # "--- !ruby/object:Gem::Version" rather than a version number. Reading the
      # archive through Gem::Package is exact, and it raises on anything that is
      # not a gem instead of printing something that looks like a version.
      - name: Build the gem
        run: |
          gem build dfc-linkml-connector.gemspec
          version=$(ruby -rrubygems/package \
            -e 'puts Gem::Package.new(ARGV[0]).spec.version' \
            dfc-linkml-connector-*.gem)
          echo "built dfc-linkml-connector ${version}"
          echo "GEM_VERSION=${version}" >> "$GITHUB_ENV"

      # Guards the release invariant that config/dfc-release.yaml's sdk_version is
      # the single source of truth: a tag whose gemspec disagrees was pushed
      # against a tree that was never bumped, and publishing it would put a
      # version number on rubygems.org that nothing else in the repo claims.
      #
      # Compared against the resolved tag rather than GITHUB_REF, so it holds on
      # both paths -- including a dispatch, where GITHUB_REF is the branch.
      - name: Check the built version matches the tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "building dfc-linkml-connector ${GEM_VERSION} from ${RELEASE_TAG}"
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$GEM_VERSION" ]; then
            echo "::error::tag is ${RELEASE_TAG} but the gemspec builds ${GEM_VERSION}"
            exit 1
          fi
          echo "tag and gemspec agree on ${GEM_VERSION}"

      # rubygems.org refuses to overwrite an existing version, so finding one
      # means the tag was pushed before. That is reported as a skip rather than a
      # failure: the usual cause is a re-run of a workflow that already published,
      # and failing would report a broken release for a healthy one.
      #
      # The API 404s for an unclaimed gem, so a non-2xx means "not published"
      # rather than an error to retry -- checked explicitly instead of leaning on
      # `curl -f` short-circuiting, which reads as an accident.
      #
      # The decision is handed to the later steps as an output because `exit 0`
      # only ends *this* step: every `run:` is its own process, so exiting here
      # would still run the push and fail on the immutable version.
      - name: Check the version is not already published
        id: already
        run: |
          published=$(curl -sS -o /tmp/versions.json -w '%{http_code}' \
            "https://rubygems.org/api/v1/versions/dfc-linkml-connector.json" || echo 000)
          if [ "$published" = "200" ] && grep -q "\"number\":\"${GEM_VERSION}\"" /tmp/versions.json; then
            echo "::warning::dfc-linkml-connector ${GEM_VERSION} is already on rubygems.org; skipping."
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          else
            echo "dfc-linkml-connector ${GEM_VERSION} is not published (API HTTP ${published}); will push."
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          fi

      # Traded for a long-lived GEM_HOST_API_KEY after MFA blocked the first attempt:
      #
      #   You have enabled multifactor authentication but no OTP code provided.
      #
      # That is not a workflow bug. A `gem push` against an MFA-enabled account
      # needs a one-time code, and an OTP is single-use and short-lived, so no
      # amount of workflow wiring makes a stored key work. RubyGems' own
      # announcement of Trusted Publishing describes this as the state it was
      # built to end: "Until now, MFA has been incompatible with automated gem
      # pushes."
      #
      # Trusted Publishing exchanges the runner's OIDC identity token for a
      # short-lived push token scoped to this one gem, so there is no long-lived
      # credential in the repository at all. It also settles gem ownership: the
      # first successful push of a pending publisher adds the pushing account as
      # an owner, which is what you want for a name that is still unclaimed.
      #
      # Requires a pending trusted publisher on rubygems.org naming this repo,
      # this workflow file, and the gem -- see docs. No inputs are needed; the
      # action defaults to trusted-publisher mode when nothing else is supplied.
      #
      # Pinned to the exact tag because this action has no moving major ref (only
      # v1.0.0, v2.0.0, v2.1.0 exist), so `@v2` would not resolve. SHA dc5a8d8 is
      # stricter still and is what rubygems' docs recommend; bump deliberately.
      - name: Authenticate to rubygems.org
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      # No `env:` block here on purpose. The action above exports
      # GEM_HOST_API_KEY for later steps; setting the variable again from
      # secrets would shadow the exchanged token with an empty string.
      - name: Push to rubygems.org
        if: steps.already.outputs.should_push == 'true'
        run: |
          if [ -z "${GEM_HOST_API_KEY}" ]; then
            echo "::error::no credential after the OIDC exchange; check the trusted publisher on rubygems.org."
            exit 1
          fi
          gem push dfc-linkml-connector-*.gem

      # Confirms the artifact is actually served, which is not the same as the
      # push having exited 0 -- propagation is not immediate and an owner
      # mismatch surfaces here rather than at the user's install.
      - name: Confirm it is served
        if: steps.already.outputs.should_push == 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://rubygems.org/api/v1/versions/dfc-linkml-connector.json" \
               | grep -q "\"number\":\"${GEM_VERSION}\""; then
              echo "rubygems.org serves dfc-linkml-connector ${GEM_VERSION}"
              exit 0
            fi
            echo "attempt ${attempt}/6: ${GEM_VERSION} not visible yet, waiting 30s"
            sleep 30
          done
          echo "::error::pushed ${GEM_VERSION} but rubygems.org is not serving it yet"
          exit 1
