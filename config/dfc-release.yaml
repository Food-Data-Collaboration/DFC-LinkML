# DFC release manifest — machine-readable source of truth for SDK generation.
#
# Everything generated in this repo must be reproducible from the pins below.
# Bump versions here, then run `make generate` (or
# `python3 scripts/generate_all.py`) and commit the regenerated output.
# See docs/generation.md.

dfc_ontology_version: "2.0.0"
dfc_taxonomy_version: "2.0.0"

# SDK version — the version of the generated connectors, which tracks the DFC
# major version and is independent of the ontology/taxonomy pins above.
# This is the single source of truth. scripts/tag_release.py bumps it and
# fans it out to every manifest; do not hand-edit the versions it writes:
#
#   typescript-connector/jsr.json          (static; jsr.io publish)
#   typescript-connector/package.json      (static; npm identity)
#   ruby-gem/*.gemspec                     (generated from this value)
#
# php-connector/composer.json deliberately has no version: packagist.org
# derives it from the git tag instead.
#
# The registries need different tag shapes for the same release, which
# tag_release.py creates together:
#
#   @siol-data/linkml-connector@X.Y.Z   jsr.io     (publish-jsr.yml trigger)
#   vX.Y.Z                              packagist  (composer require)
#   vX.Y.Z                              RubyGems   (gem install, once published)
sdk_version: "2.0.6"

ontology:
  business_url: "https://w3id.org/dfc/ontology/v2.0.0/src/DFC_BusinessOntology.rdf"
  technical_url: "https://w3id.org/dfc/ontology/v2.0.0/src/DFC_TechnicalOntology.rdf"

taxonomies:
  base_url: "https://w3id.org/dfc/taxonomies"
  # Canonical offline copies live in ruby-gem/vocabularies/ and are copied
  # into php-connector/vocabularies/ at generation time.

schema:
  file: "src/dfc_business_linkml_v2_0.yaml"
  config: "config/dfc-default.yaml"

outputs:
  typescript: "typescript-connector/"
  ruby: "ruby-gem/"
  php: "php-connector/"

# Original connectors the harness tests against (see tests/package.json and
# the gem pin in tests/cross_connector/adapters/official-ruby.rb). No
# original PHP v2 exists, so there is no official-php harness adapter.
original_test_versions:
  typescript: "2.0.0-beta.2"
  ruby: "2.0.0.pre.beta8"
